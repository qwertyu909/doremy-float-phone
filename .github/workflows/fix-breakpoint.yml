name: Fix Mobile Breakpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-breakpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch breakpoint
        run: sed -i 's/@media (max-width: 500px) and (hover: none) and (pointer: coarse) {/@media (max-width: 500px) {/' styles/phone-shell.css
      - name: Commit
        run: |
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git add styles/phone-shell.css
          git commit -m "fix: mobile fullscreen breakpoint for WebView" || echo no-change
          git push
