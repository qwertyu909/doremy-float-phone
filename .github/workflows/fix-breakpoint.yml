name: Fix Breakpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-breakpoint.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch CSS via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, base64, os
          api = 'https://api.github.com/repos/qwertyu909/doremy-float-phone/contents/styles/phone-shell.css?ref=main'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          d = json.load(urllib.request.urlopen(urllib.request.Request(api, headers=headers)))
          old = '@media (max-width: 500px) and (hover: none) and (pointer: coarse) {'
          new = '@media (max-width: 500px) {'
          s = base64.b64decode(d['content']).decode('utf-8')
          if old not in s:
              print('already patched')
          else:
              patched = s.replace(old, new, 1)
              body = json.dumps({'message': 'fix: mobile fullscreen breakpoint for WebView', 'content': base64.b64encode(patched.encode()).decode(), 'sha': d['sha'], 'branch': 'main'}).encode()
              req = urllib.request.Request(api.split('?')[0], data=body, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
              print('commit:', json.load(urllib.request.urlopen(req))['commit']['sha'])
          PY
