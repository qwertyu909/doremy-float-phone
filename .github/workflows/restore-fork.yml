name: Restore Fork Files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-fork.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore files from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/idikale163-source/doremy-float-phone/main/README.md -o README.md
          curl -fsSL https://raw.githubusercontent.com/idikale163-source/doremy-float-phone/main/android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt -o android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt
          git config user.name "restore-bot"
          git config user.email "restore-bot@users.noreply.github.com"
          git add README.md android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "restore: sync README and MainActivity from upstream"
            git push origin HEAD:main
          fi
