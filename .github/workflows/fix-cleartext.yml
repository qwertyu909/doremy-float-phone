name: Fix Cleartext
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-cleartext.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch manifest via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, base64, os
          api = 'https://api.github.com/repos/qwertyu909/doremy-float-phone/contents/android-shell/app/src/main/AndroidManifest.xml?ref=main'
          h = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          d = json.load(urllib.request.urlopen(urllib.request.Request(api, headers=h)))
          s = base64.b64decode(d['content']).decode('utf-8')
          old = 'android:usesCleartextTraffic="false"'
          new = 'android:usesCleartextTraffic="true"'
          if old not in s:
              print('already patched')
          else:
              p = s.replace(old, new, 1)
              body = json.dumps({'message': 'fix: allow cleartext HTTP for local API', 'content': base64.b64encode(p.encode()).decode(), 'sha': d['sha'], 'branch': 'main'}).encode()
              r = urllib.request.Request(api.split('?')[0], data=body, method='PUT', headers={**h, 'Content-Type': 'application/json'})
              print('commit:', json.load(urllib.request.urlopen(r))['commit']['sha'])
          PY
