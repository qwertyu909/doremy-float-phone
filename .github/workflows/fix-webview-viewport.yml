name: Fix WebView Viewport
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-webview-viewport.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply viewport fix
        run: python3 -c "p='android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt';s=open(p,encoding='utf-8').read();o='            javaScriptEnabled = true\n            domStorageEnabled = true';n='            javaScriptEnabled = true\n            useWideViewPort = true\n            loadWithOverviewMode = true\n            domStorageEnabled = true';print('applied' if o in s else 'skip');open(p,'w',encoding='utf-8').write(s.replace(o,n,1))"
      - name: Cleanup
        run: rm -f PATCH_FORMAT_TEST.md
      - name: Commit
        run: |
          git config user.name fix-bot
          git config user.email fix-bot@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: WebView respect viewport meta"
            git push origin HEAD:main
          fi
