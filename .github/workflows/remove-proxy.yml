name: Remove Proxy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-proxy.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch MainActivity via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import urllib.request, json, base64, os
          api = 'https://api.github.com/repos/qwertyu909/doremy-float-phone/contents/android-shell/app/src/main/java/app/floatphone/shell/MainActivity.kt?ref=main'
          h = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
          d = json.load(urllib.request.urlopen(urllib.request.Request(api, headers=h)))
          s = base64.b64decode(d['content']).decode('utf-8')
          start = s.find('        val proxyClient = OkHttpClient.Builder().followRedirects(true).build()')
          marker = '            override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {'
          end = s.find(marker, start)
          if start == -1 or end == -1:
              print('anchors not found, skip')
          else:
              s = s[:start] + '        webView.webViewClient = object : WebViewClient() {\n' + s[end:]
              body = json.dumps({'message': 'fix: load own site directly, remove proxy to author backend', 'content': base64.b64encode(s.encode()).decode(), 'sha': d['sha'], 'branch': 'main'}).encode()
              r = urllib.request.Request(api.split('?')[0], data=body, method='PUT', headers={**h, 'Content-Type': 'application/json'})
              print('commit:', json.load(urllib.request.urlopen(r))['commit']['sha'])
          PY
